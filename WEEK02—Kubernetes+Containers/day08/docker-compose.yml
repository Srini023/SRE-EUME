version: "3.9"

services:
  frontend:
    build: .
    container_name: webapp
    ports:
      - "8080:80"
    volumes:
      - ./nginx-logs:/var/log/nginx
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    image: python:3.11-slim
    container_name: api
    working_dir: /app
    volumes:
      - ./backend:/app
    command: python app.py
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/appdb
    expose:
      - "5000"
    depends_on:
      - db
    networks:
      - app-network

  db:
    image: postgres:15-alpine
    container_name: database
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=appdb
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db-data:

